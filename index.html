<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Galaxia</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Arial', sans-serif;
      touch-action: none; /* Evita que la página se desplace al tocar */
    }
    #webgl-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>
</head>
<body>

  <div id="webgl-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // 1. ESCENA, CÁMARA Y RENDERIZADOR
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    
    const isMobile = window.innerWidth < 768;
    const camera = new THREE.PerspectiveCamera(
      isMobile ? 65 : 60,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, isMobile ? 8 : 7, isMobile ? 12 : 11);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // GRUPO PRINCIPAL
    const galaxyGroup = new THREE.Group();
    scene.add(galaxyGroup);

    // 2. GALAXIA EN ESPIRAL (PARTÍCULAS)
    const parameters = {
      count: isMobile ? 12000 : 16000,
      size: isMobile ? 0.04 : 0.035,
      radius: 8,
      branches: 3,
      spin: 1.2,
      randomness: 0.5,
      insideColor: '#ff1493',
      outsideColor: '#ffb6c1'
    };

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(parameters.count * 3);
    const colors = new Float32Array(parameters.count * 3);

    const colorInside = new THREE.Color(parameters.insideColor);
    const colorOutside = new THREE.Color(parameters.outsideColor);

    for (let i = 0; i < parameters.count; i++) {
      const i3 = i * 3;
      const radius = Math.random() * parameters.radius;
      const spinAngle = radius * parameters.spin;
      const branchAngle = ((i % parameters.branches) / parameters.branches) * Math.PI * 2;

      const randomX = (Math.random() - 0.5) * parameters.randomness * radius;
      const randomY = (Math.random() - 0.5) * parameters.randomness * radius;
      const randomZ = (Math.random() - 0.5) * parameters.randomness * radius;

      positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
      positions[i3 + 1] = randomY;
      positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

      const mixedColor = colorInside.clone();
      mixedColor.lerp(colorOutside, radius / parameters.radius);

      colors[i3] = mixedColor.r;
      colors[i3 + 1] = mixedColor.g;
      colors[i3 + 2] = mixedColor.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: parameters.size,
      sizeAttenuation: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexColors: true
    });

    const galaxy = new THREE.Points(geometry, material);
    galaxyGroup.add(galaxy);

    // 3. NÚCLEO CENTRAL
    const coreGeometry = new THREE.SphereGeometry(0.5, 32, 32);
    const coreMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const core = new THREE.Mesh(coreGeometry, coreMaterial);
    galaxyGroup.add(core);

    // 4. FRASES FLOTANTES
    const phrases = [
      "ERES MI PRINCESA💞",
      "ERES MI VIDA💞",
      "ERES MI CIELO💞",
      "ERES MI SOL💞",
      "ERES MI REINA💞",
      "ERES MI LUZ💞",
      "ERES MI MUNDO💞",
      "ERES MI TODO💞",
      "ERES MI SUEÑO💞",
      "ERES MI AMOR💞",
      "ERES MI UNIVERSO💞",
      "ERES MI LUGAR SEGURO💞"
    ];

    function createTextSprite(text) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512;
      canvas.height = 128;

      ctx.font = 'Bold 34px Arial';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ff1493';
      ctx.shadowBlur = 12;
      ctx.fillText(text, canvas.width / 2, canvas.height / 2 + 12);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMaterial = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        blending: THREE.AdditiveBlending
      });

      const sprite = new THREE.Sprite(spriteMaterial);
      const scaleX = isMobile ? 2.4 : 2.8;
      sprite.scale.set(scaleX, scaleX * 0.25, 1);
      return sprite;
    }

    phrases.forEach((phrase, index) => {
      const sprite = createTextSprite(phrase);
      
      const angle = (index / phrases.length) * Math.PI * 2;
      const radius = 2.5 + Math.random() * 4.2;
      
      sprite.position.x = Math.cos(angle) * radius;
      sprite.position.y = (Math.random() - 0.5) * 0.8;
      sprite.position.z = Math.sin(angle) * radius;

      galaxyGroup.add(sprite);
    });

    // 5. CONTROL TÁCTIL Y MOUSE MANUAL (100% COMPATIBLE CON MÓVILES)
    let isDragging = false;
    let previousTouchX = 0;
    let previousTouchY = 0;

    // Eventos para Teléfono (Touch)
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        previousTouchX = e.touches[0].clientX;
        previousTouchY = e.touches[0].clientY;
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging || e.touches.length !== 1) return;

      const deltaX = e.touches[0].clientX - previousTouchX;
      const deltaY = e.touches[0].clientY - previousTouchY;

      galaxyGroup.rotation.y += deltaX * 0.005;
      galaxyGroup.rotation.x += deltaY * 0.005;

      previousTouchX = e.touches[0].clientX;
      previousTouchY = e.touches[0].clientY;
    });

    window.addEventListener('touchend', () => {
      isDragging = false;
    });

    // Eventos para Mouse (PC)
    window.addEventListener('mousedown', (e) => {
      isDragging = true;
      previousTouchX = e.clientX;
      previousTouchY = e.clientY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;

      const deltaX = e.clientX - previousTouchX;
      const deltaY = e.clientY - previousTouchY;

      galaxyGroup.rotation.y += deltaX * 0.005;
      galaxyGroup.rotation.x += deltaY * 0.005;

      previousTouchX = e.clientX;
      previousTouchY = e.clientY;
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    // 6. ANIMACIÓN
    const clock = new THREE.Clock();

    function animate() {
      const elapsedTime = clock.getElapsedTime();
      
      // Rotación continua cuando no se está arrastrando con el dedo
      if (!isDragging) {
        galaxyGroup.rotation.y += 0.002;
      }

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
